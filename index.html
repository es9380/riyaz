<script>
  /* Set the theme before first paint (no flash). Key + JSON format shared
     with core/store.js (tsn_theme_v1). */
  try {
    var raw = localStorage.getItem("tsn_theme_v1");
    var t = raw ? JSON.parse(raw) : null;
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
